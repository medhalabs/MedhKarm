# MedhKarm's offline Semgrep rules: the security engineer (Vikram) runs them on the code a
# run changed. ERROR blocks the release until fixed; WARNING is shown to the founder.
# Copied into the sandbox image at /opt/medhkarm/semgrep.yml (see Dockerfile).
rules:
  # ---------- Python ----------
  - id: py-eval-exec
    languages: [python]
    severity: ERROR
    message: eval() or exec() runs text as code; with any outside input that is remote code execution.
    metadata:
      fix: Parse the input instead (json.loads, ast.literal_eval, a lookup table).
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
      - pattern-not: eval("...")
      - pattern-not: exec("...")

  - id: py-shell-true
    languages: [python]
    severity: ERROR
    message: A shell command with shell=True can be hijacked through its arguments (shell injection).
    metadata:
      fix: Pass the command as a list of arguments, without shell=True.
    pattern: subprocess.$FUNC(..., shell=True, ...)

  - id: py-os-system
    languages: [python]
    severity: WARNING
    message: os.system/os.popen run a shell command; with outside input that is shell injection.
    metadata:
      fix: Use subprocess.run([...]) with a list of arguments.
    pattern-either:
      - pattern: os.system(...)
      - pattern: os.popen(...)

  - id: py-sql-built-from-strings
    languages: [python]
    severity: ERROR
    message: SQL built from strings is open to SQL injection.
    metadata:
      fix: Use query parameters, e.g. cursor.execute("... WHERE id = ?", (user_id,)).
    pattern-either:
      - pattern: $CUR.execute(f"...", ...)
      - pattern: $CUR.execute("..." % $X, ...)
      - pattern: $CUR.execute("..." + $X, ...)
      - pattern: $CUR.execute("...".format(...), ...)
      - pattern: $CUR.executemany(f"...", ...)

  - id: py-yaml-unsafe-load
    languages: [python]
    severity: ERROR
    message: yaml.load without a safe loader can build any Python object from the file.
    metadata:
      fix: Use yaml.safe_load(...).
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=SafeLoader, ...)

  - id: py-pickle-load
    languages: [python]
    severity: WARNING
    message: pickle can run code while loading; never load pickles from users or the network.
    metadata:
      fix: Use JSON for data that comes from outside.
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)

  - id: py-tls-verify-off
    languages: [python]
    severity: ERROR
    message: TLS certificate checks are turned off, so the connection can be intercepted.
    metadata:
      fix: Remove verify=False.
    pattern: requests.$METHOD(..., verify=False, ...)

  - id: py-debug-server
    languages: [python]
    severity: WARNING
    message: The web server runs in debug mode, which exposes a code console and stack traces.
    metadata:
      fix: Read debug from an environment variable and keep it off in production.
    pattern: $APP.run(..., debug=True, ...)

  - id: py-weak-hash
    languages: [python]
    severity: WARNING
    message: MD5 and SHA-1 are broken for security; never use them for passwords or signatures.
    metadata:
      fix: Use hashlib.sha256 for checksums and bcrypt/argon2 (or hashlib.scrypt) for passwords.
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)

  - id: py-insecure-tempfile
    languages: [python]
    severity: WARNING
    message: tempfile.mktemp is unsafe (another process can take the name first).
    metadata:
      fix: Use tempfile.NamedTemporaryFile or tempfile.mkstemp.
    pattern: tempfile.mktemp(...)

  # ---------- JavaScript / TypeScript ----------
  - id: js-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: eval() or new Function() runs text as code; with any outside input that is remote code execution.
    metadata:
      fix: Parse the input instead (JSON.parse, a lookup table).
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
      - pattern-not: eval("...")

  - id: js-command-from-template
    languages: [javascript, typescript]
    severity: ERROR
    message: A shell command built from a template string can be hijacked (shell injection).
    metadata:
      fix: Use execFile/spawn with an argument list.
    pattern-either:
      - pattern: $CP.exec(`...${$X}...`, ...)
      - pattern: $CP.execSync(`...${$X}...`, ...)

  - id: js-sql-from-template
    languages: [javascript, typescript]
    severity: ERROR
    message: SQL built from a template string is open to SQL injection.
    metadata:
      fix: Use query parameters, e.g. db.query("... WHERE id = $1", [id]).
    pattern-either:
      - pattern: $DB.query(`...${$X}...`, ...)
      - pattern: $DB.execute(`...${$X}...`, ...)

  - id: js-inner-html
    languages: [javascript, typescript]
    severity: WARNING
    message: Writing HTML from data can run attackers' scripts (cross-site scripting).
    metadata:
      fix: Use textContent, or React's normal rendering.
    pattern-either:
      - pattern: $EL.innerHTML = $X
      - pattern: document.write(...)
      - pattern: |
          <$EL dangerouslySetInnerHTML={...} />

  - id: js-tls-verify-off
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS certificate checks are turned off, so connections can be intercepted.
    metadata:
      fix: Remove it.
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: "{..., rejectUnauthorized: false, ...}"

[project]
name = "medhkarm-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "daytona>=0.220.0",
    "docker>=7.2.0",
    "fastapi>=0.142.2",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "litellm>=1.103.1",
    "mcp>=1.30.0",
    "openhands-sdk>=1.50.1",
    "openhands-tools>=1.50.1",
    "openhands-workspace>=1.50.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Eval tasks are sample customer projects, not our code.
extend-exclude = ["evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docker.*", "litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app", "tests"]
markers = ["integration: needs real services (Docker, network); run with -m integration"]
addopts = "-m 'not integration'"

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layers: entry points > features > shared > core"
type = "layers"
layers = [
    "app.main | app.workers",
    "app.features",
    "app.shared",
    "app.core",
]

# The Next.js starter: one app for pages and API routes. Runs with no keys (local mode).
name = "nextjs"
title = "Next.js"
description = "Next.js app (pages and API routes) with a data layer that runs locally and on Supabase or any Postgres"
setup_command = "npm ci --prefer-offline --no-audit --no-fund"
# Type-check first: developers see broken imports while they work, not only at QA
test_command = "npm run typecheck && npm test"
# The rules every developer gets in their brief (small models skip reading AGENTS.md)
rules = """
- Data: `import { getStore } from "@/lib/db"`, then `getStore().collection<T>("name")` (insert, find, findOne, update, remove, count). It works locally and on Supabase/Postgres: never add another database client or call Supabase directly.
- Imports: always `@/…` (e.g. `@/lib/auth`), never long `../../` paths.
- Read a module's files in lib/ before using it; don't rewrite what's there.
- Tests: vitest in tests/ for lib/ code. Check with `npm run typecheck && npm test`.
"""

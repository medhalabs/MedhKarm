# Local development services. Production uses Supabase (Postgres) and a managed Redis.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: medhkarm
      POSTGRES_PASSWORD: medhkarm
      POSTGRES_DB: medhkarm
    ports:
      - "5442:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medhkarm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
